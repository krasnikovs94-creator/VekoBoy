<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ВеткоБой — 1.0</title><style>*{box-sizing:border-box}body{margin:0;background:#182a31;color:white;font-family:system-ui;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#ui{position:fixed;inset:0;pointer-events:none}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;background:#ffc845;color:#2c2311;padding:12px 17px;font-weight:800}button:active{transform:scale(.97)}.screen{position:absolute;inset:0;background:linear-gradient(130deg,#1d3d49ee,#10252eea);display:flex;align-items:center;justify-content:center;pointer-events:auto;overflow:auto}.panel{width:min(94vw,540px);background:#102b36ee;border:2px solid #ffffff33;border-radius:24px;padding:24px;box-shadow:0 20px 60px #0006}.panel h1{font-size:clamp(28px,6vw,46px);margin:0 0 8px;color:#ffcf63}.panel h2{margin:0 0 14px}.panel p{color:#d4e7e7}.menuBtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.menuBtns button:last-child{grid-column:span 2;background:#77dd86}.hide{display:none!important}#hud{position:absolute;inset:0;pointer-events:none}#top{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;font-size:clamp(12px,2.8vw,18px);font-weight:800;text-shadow:1px 2px 3px #000}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:32px;color:#fff9;text-shadow:0 1px 3px black}#stick{position:absolute;bottom:12%;left:6%;width:112px;height:112px;border-radius:50%;background:#ffffff27;border:3px solid #ffffff77;pointer-events:auto;touch-action:none}#nub{position:absolute;left:33px;top:33px;width:40px;height:40px;border-radius:50%;background:#ffda74aa}#shoot{position:absolute;bottom:13%;right:6%;width:94px;height:94px;border-radius:50%;background:#ffca4c;border:4px solid #fff9;pointer-events:auto;font-size:18p (()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,1.6);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const $=id=>document.getElementById(id);const names=['Веточный пистолет','Берёзовый скорострел','Дубовый дробовик','Сосновый карабин','Лесной гром','Золотая ветка'];const colors=['#b9a78e','#8fcaa0','#71b8f1','#b695f4','#ffc56e','#ff7d7d'];const damage=[25,18,45,38,55,75],rate=[.42,.16,.8,.48,.65,.72],capacity=[12,24,6,10,8,5];let save;try{save=JSON.parse(localStorage.getItem('vetkoboy-save'))||{nick:'Игрок',coins:0,owned:[0],selected:0}}catch{save={nick:'Игрок',coins:0,owned:[0],selected:0}};if(!Array.isArray(save.owned)||!save.owned.length)save.owned=[0];function persist(){try{localStorage.setItem('vetkoboy-save',JSON.stringify(save))}catch{}}function updateMenu(){$('nickname').textContent=save.nick;$('coins').textContent=save.coins}updateMenu();const hideAll=()=>['menu','sub','end'].forEach(id=>$(id).classList.add('hide'));function menu(){running=false;$('hud').classList.add('hide');hideAll();updateMenu();$('menu').classList.remove('hide')}function page(which){hideAll();let html='';if(which==='profile')html='<h2>👤 Ник игрока</h2><input id="nickInput" maxlength="18" placeholder="Ваш ник"><p>Имя отображается в меню и результатах.</p><button id="saveNick">Сохранить</button>';if(which==='inventory')html='<h2>🎒 Инвентарь</h2><p>Ваш первый ящик уже открыт: в нём веточный пистолет.</p>'+save.owned.map(i=>`<div class="item">🌿 <b>${names[i]}</b><br>Урон ${damage[i]} · Патроны ${capacity[i]} <button data-equip="${i}">${save.selected===i?'Выбрано':'Взять'}</button></div>`).join('');if(which==='shop')html='<h2>📦 Магазин — 6 ящиков</h2><p>Зарабатывай монеты в матчах. Содержимое случайное, повторения возможны (компенсация монетами).</p><div class="grid">'+names.map((n,i)=>`<div class="item"><span class="tag">${['Обычный','Необычный','Редкий','Эпический','Легендарный','Мифический'][i]}</span><br>📦 ${i===0?'Веточный':n}<br>🪙 ${[50,100,200,350,500,750][i]}<br><button data-buy="${i}">Открыть</button></div>`).join('')+'</div>';html+='<button class="back" id="back">← Назад</button>';$('subcontent').innerHTML=html;$('sub').classList.remove('hide');if(which==='profile'){$('nickInput').value=save.nick;$('saveNick').onclick=()=>{save.nick=$('nickInput').value.trim()||'Игрок';persist();menu()}}$('subcontent').querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{save.selected=+b.dataset.equip;persist();page('inventory')});$('subcontent').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const tier=+b.dataset.buy,cost=[50,100,200,350,500,750][tier];if(save.coins<cost){alert('Недостаточно монет');return}save.coins-=cost;let got=Math.min(5,Math.max(0,tier+(Math.random()<.22?1:0)-(Math.random()<.2?1:0)));if(save.owned.includes(got)){save.coins+=Math.floor(cost*.3);alert('Повтор: '+names[got]+'. Возвращено 30% стоимости.')}else{save.owned.push(got);alert('Получено: '+names[got]+'!')}persist();page('shop')});$('back').onclick=menu}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));$('play').onclick=start;$('again').onclick=start;$('toMenu').onclick=menu;

const mapSize=23;const blocks=[[-8,6,4,4],[-10,-7,4,4],[8,-8,5,4],[9,7,4,5],[-1,-11,5,3],[-3,10,4,3],[-12,0,2,5],[12,0,2,5]];const hay=[[-5,-3],[4,5],[5,-4],[-7,1],[0,7],[7,0]];let bots=[],px=0,pz=0,yaw=0,pitch=0,hp=100,kills=0,elapsed=0,ammo=12,shotClock=0,dead=0,running=false,last=0,flash=0,moveX=0,moveY=0,keys={},jump=0,jumpV=0,invul=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b,c,d)=>Math.hypot(a-c,b-d);function blocked(x,z){if(Math.abs(x)>mapSize-1||Math.abs(z)>mapSize-1)return true;return blocks.some(([bx,bz,w,h])=>Math.abs(x-bx)<w/2+.48&&Math.abs(z-bz)<h/2+.48)}function spawnBot(b){for(let j=0;j<90;j++){const x=(Math.random()-.5)*38,z=(Math.random()-.5)*38;if(!blocked(x,z)&&dist(x,z,px,pz)>6){Object.assign(b,{x,z,hp:100,angle:Math.random()*6.28,decision:0,fire:Math.random()*1.2,alive:true});return}}Object.assign(b,{x:10,z:0,hp:100,angle:0,decision:0,fire:1,alive:true})}function start(){hideAll();$('hud').classList.remove('hide');px=0;pz=0;yaw=0;pitch=0;hp=100;kills=0;elapsed=0;ammo=capacity[save.selected];shotClock=0;dead=0;invul=0;flash=0;jump=0;jumpV=0;bots=Array.from({length:6},(_,i)=>({id:i,name:'Бот_'+(i+1),alive:false,respawn:0}));bots.forEach(spawnBot);running=true;last=performance.now();requestAnimationFrame(loop)}function finish(win){running=false;$('hud').classList.add('hide');hideAll();$('end').classList.remove('hide');const reward=kills*15+(win?100:20);save.coins+=reward;persist();$('endtitle').textContent=win?'🏆 Победа!':'Матч завершён';$('endstats').textContent=`${save.nick}: ${kills} попаданий с устранением · Награда ${reward} монет`;}function toast(s){$('toast').textContent=s;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),750)}function project(x,y,z){const dx=x-px,dz=z-pz;const forward=dx*Math.sin(yaw)+dz*Math.cos(yaw),side=dx*Math.cos(yaw)-dz*Math.sin(yaw);if(forward<=.13)return null;const focal=Math.min(W*1.1,H*1.4),eye=1.6+jump;return {x:W/2+side/forward*focal,y:H/2+(eye-y)/forward*focal+pitch*H*.65,z:forward,scale:focal/forward}}function poly(points,color){const pts=points.map(p=>project(...p));if(pts.some(p=>!p))return;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.fill()}function box3(x,z,w,d,h,front,side,roof){poly([[x-w/2,0,z-d/2],[x+w/2,0,z-d/2],[x+w/2,h,z-d/2],[x-w/2,h,z-d/2]],front);poly([[x+w/2,0,z-d/2],[x+w/2,0,z+d/2],[x+w/2,h,z+d/2],[x+w/2,h,z-d/2]],side);poly([[x-w/2,h,z-d/2],[x+w/2,h,z-d/2],[x+w/2,h,z+d/2],[x-w/2,h,z+d/2]],roof)}function render(){ctx.fillStyle='#82cbe9';ctx.fillRect(0,0,W,H);let horizon=H/2+pitch*H*.65;ctx.fillStyle='#bde7fa';ctx.fillRect(0,horizon-70,W,70);ctx.fillStyle='#78b86c';ctx.fillRect(0,horizon,W,H-horizon);ctx.fillStyle='#c9aa75';ctx.fillRect(0,horizon+H*.07,W,H);const objects=[];function add(x,z,fn){const depth=(x-px)*Math.sin(yaw)+(z-pz)*Math.cos(yaw);if(depth>.1&&depth<55)objects.push({depth,fn})}blocks.forEach(([x,z,w,d],i)=>add(x,z,()=>{box3(x,z,w,d,2.8,i%2?'#d2a16c':'#93b5c6','#6d8790','#a24f39');poly([[x-w/2-.4,2.8,z-d/2-.4],[x,4,z-d/2-.4],[x+w/2+.4,2.8,z-d/2-.4]],'#753f31');const p=project(x,1.5,z-d/2-.02);if(p){ctx.fillStyle='#385e76';ctx.fillRect(p.x-p.scale*.25,p.y-p.scale*.35,p.scale*.5,p.scale*.7)}}));hay.forEach(([x,z])=>add(x,z,()=>box3(x,z,1.6,1.5,.9,'#e2c16a','#ba954a','#ffe096')));for(let i=-2;i<=2;i++){add(-17,i*9,()=>tree(-17,i*9));add(17,i*9+3,()=>tree(17,i*9+3))}bots.forEach(b=>{if(b.alive)add(b.x,b.z,()=>drawBot(b))});objects.sort((a,b)=>b.depth-a.depth).forEach(o=>o.fn());drawGun();if(flash>0){ctx.fillStyle=`rgba(255,228,120,${flash*.35})`;ctx.beginPath();ctx.arc(W*.61,H*.77,Math.min(W,H)*.14,0,7);ctx.fill()}}function tree(x,z){const p=project(x,1.7,z);if(!p)return;ctx.fillStyle='#76502e';ctx.fillRect(p.x-p.scale*.12,p.y,p.scale*.24,p.scale*1.8);ctx.fillStyle='#3e9a53';for(const [a,b,r] of [[0,-1.1,.9],[-.4,-.65,.7],[.4,-.65,.7]]){ctx.beginPath();ctx.arc(p.x+a*p.scale,p.y+b*p.scale,r*p.scale,0,7);ctx.fill()}}function drawBot(b){const p=project(b.x,1.1,b.z);if(!p)return;const s=p.scale;if(s>1500)return;ctx.fillStyle='#333a49';ctx.fillRect(p.x-s*.3,p.y-s*.1,s*.6,s*1.05);ctx.fillStyle=['#e8886c','#9bd9a6','#c59be2'][b.id%3];ctx.fillRect(p.x-s*.38,p.y-s*.45,s*.76,s*.65);ctx.fillStyle='#f1c29a';ctx.beginPath();ctx.arc(p.x,p.y-s*.66,s*.29,0,7);ctx.fill();ctx.fillStyle='#51452c';ctx.fillRect(p.x-s*.35,p.y-s*.9,s*.7,s*.19);ctx.fillStyle='#714421';ctx.fillRect(p.x-s*.05,p.y-s*.15,s*.85,s*.15);ctx.fillStyle='#0009';ctx.fillRect(p.x-s*.4,p.y-s*1.12,s*.8,7);ctx.fillStyle='#69e27c';ctx.fillRect(p.x-s*.4,p.y-s*1.12,s*.8*b.hp/100,7);if(s>18){ctx.fillStyle='white';ctx.font=`bold ${clamp(s*.18,10,18)}px system-ui`;ctx.textAlign='center';ctx.fillText(b.name,p.x,p.y-s*1.2)}}function drawGun(){const x=W*.61,y=H*.87;ctx.save();ctx.translate(x,y+Math.sin(elapsed*9)*Math.min(4,Math.hypot(moveX,moveY)*3));ctx.rotate(-.18);ctx.fillStyle='#b07a45';ctx.beginPath();ctx.moveTo(-26,35);ctx.lineTo(-15,-35);ctx.lineTo(14,-57);ctx.lineTo(34,-18);ctx.lineTo(70,-35);ctx.lineTo(78,-23);ctx.lineTo(30,3);ctx.lineTo(28,50);ctx.closePath();ctx.fill();ctx.strokeStyle='#6d472a';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-5,-20);ctx.lineTo(48,-44);ctx.stroke();ctx.strokeStyle='#80c16a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(10,-44);ctx.lineTo(23,-60);ctx.moveTo(40,-39);ctx.lineTo(55,-60);ctx.stroke();ctx.fillStyle='#f0c39c';ctx.fillRect(-15,13,35,70);ctx.restore()}function canSee(b){const n=15;for(let i=1;i<n;i++){const t=i/n;if(blocked(px+(b.x-px)*t,pz+(b.z-pz)*t))return false}return true}function shoot(){if(!running||shotClock>0)return;if(ammo<=0){ammo=capacity[save.selected];shotClock=1.15;toast('🌿 Перезарядка');return}ammo--;shotClock=rate[save.selected];flash=.32;let target=null,best=1e9;for(const b of bots){if(!b.alive||!canSee(b))continue;const p=project(b.x,1.2,b.z);if(!p)continue;const err=Math.hypot((p.x-W/2)/Math.max(15,p.scale*.42),(p.y-H/2)/Math.max(15,p.scale*.8));if(err<1.2&&p.z<best){best=p.z;target=b}}if(target){target.hp-=damage[save.selected];if(target.hp<=0){target.alive=false;target.respawn=3.5;kills++;toast('🎯 '+target.name+' +15 🪙');if(kills>=20){finish(true);return}}}if(ammo===0)toast('Нажми ОГОНЬ для перезарядки')}function update(dt){elapsed+=dt;shotClock=Math.max(0,shotClock-dt);flash=Math.max(0,flash-dt*2);invul=Math.max(0,invul-dt);let x=moveX+(keys.d?1:0)-(keys.a?1:0),y=moveY+(keys.s?1:0)-(keys.w?1:0);const len=Math.max(1,Math.hypot(x,y));x/=len;y/=len;const speed=5.5;const nx=px+(x*Math.cos(yaw)-y*Math.sin(yaw))*speed*dt,nz=pz+(-x*Math.sin(yaw)-y*Math.cos(yaw))*speed*dt;if(!blocked(nx,pz))px=nx;if(!blocked(px,nz))pz=nz;if(keys.ArrowLeft)yaw-=dt*1.9;if(keys.ArrowRight)yaw+=dt*1.9;if(jump>0||jumpV>0){jumpV-=14*dt;jump=Math.max(0,jump+jumpV*dt);if(jump===0)jumpV=0}for(const b of bots){if(!b.alive){b.respawn-=dt;if(b.respawn<=0)spawnBot(b);continue}const d=dist(b.x,b.z,px,pz);b.decision-=dt;b.fire-=dt;if(b.decision<=0){b.decision=.7+Math.random()*1.2;b.angle=Math.atan2(px-b.x,pz-b.z)+(Math.random()-.5)*1.7}if(d>3.5){const nx=b.x+Math.sin(b.angle)*dt*2.2,nz=b.z+Math.cos(b.angle)*dt*2.2;if(!blocked(nx,nz)){b.x=nx;b.z=nz}else b.decision=0}if(d<13&&b.fire<=0&&canSee(b)){b.fire=.8+Math.random()*1.3;if(Math.random()<.52&&invul<=0){hp=Math.max(0,hp-(7+Math.floor(Math.random()*8)));invul=.4;if(hp<=0){finish(false);return}}}}$('health').textContent='❤️ '+hp;$('score').textContent='🎯 '+kills+' / 20';const remaining=Math.max(0,300-elapsed);$('timer').textContent='⏱ '+String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(Math.floor(remaining%60)).padStart(2,'0');$('ammo').textContent='🌰 '+ammo+'/'+capacity[save.selected];if(remaining<=0)finish(kills>=20)}function loop(t){if(!running)return;const dt=Math.min(.05,(t-last)/1000||.016);last=t;update(dt);render();if(running)requestAnimationFrame(loop)}const stick=$('stick'),nub=$('nub');function stickMove(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.max(1,Math.hypot(dx,dy)),max=35;moveX=clamp(dx/max,-1,1);moveY=clamp(dy/max,-1,1);if(len>max){moveX=dx/len;moveY=dy/len}nub.style.transform=`translate(${moveX*max}px,${moveY*max}px)`}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);stickMove(e)};stick.onpointermove=e=>{if(stick.hasPointerCapture(e.pointerId))stickMove(e)};function release(){moveX=moveY=0;nub.style.transform='translate(0,0)'}stick.onpointerup=release;stick.onpointercancel=release;let looking=false,lx=0,ly=0;canvas.onpointerdown=e=>{if(!running)return;looking=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!looking)return;yaw+=(e.clientX-lx)*.004;pitch=clamp(pitch+(e.clientY-ly)*.002,-.75,.75);lx=e.clientX;ly=e.clientY};canvas.onpointerup=canvas.onpointercancel=()=>looking=false;$('shoot').onpointerdown=e=>{e.preventDefault();shoot()};$('jump').onpointerdown=e=>{e.preventDefault();if(jump===0)jumpV=5};$('pause').onclick=()=>{if(running){running=false;$('hud').classList.add('hide');hideAll();$('end').classList.remove('hide');$('endtitle').textContent='Пауза';$('endstats').textContent='Матч приостановлен';$('again').textContent='Продолжить';$('again').onclick=()=>{hideAll();$('hud').classList.remove('hide');running=true;last=performance.now();requestAnimationFrame(loop)}}};addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'&&jump===0)jumpV=5;if(e.key==='Enter')shoot()});addEventListener('keyup',e=>keys[e.key]=false);$('again').addEventListener('click',()=>{$('again').textContent='Ещё раз';$('again').onclick=start});render();})();
