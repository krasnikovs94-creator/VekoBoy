
name: VetkoBoy Auto Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-game:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download game
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Test game
        run: npm test

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VetkoBoy-Screenshots
          path: |
            game-screen.png
            test-results/
          retention-days: 7

